<style>
:root{
  --bg:#1e1e1e; --side:#262626; --card:#282828; --card-h:#2e2e2e; --line:#343434; --line2:#3e3e3e;
  --text:#ebebeb; --muted:#a3a3a3; --faint:#737373; --accent:#dc4c3e; --accent-h:#c3392c; --accent-text:#ff7066;
  --sel:#3a2422; --hover:#2d2d2d; --input:#1b1b1b; --menu:#2b2b2b; --overlay:rgba(0,0,0,.6);
  --shadow:0 12px 40px rgba(0,0,0,.55); --c-today:#25b84c; --c-tom:#ff9a14; --c-week:#a970ff; --c-over:#ff7066;
  --p1:#ff7066; --p2:#ff9a14; --p3:#5297ff; --p4:#8a8a8a;
  --ev-text:#f3f3f3; --ev-red:#7c3934; --ev-orange:#7d5314; --ev-yellow:#6b5f14; --ev-green:#2e5a36; --ev-teal:#1f5559;
  --ev-blue:#243f6e; --ev-purple:#533a7a; --ev-pink:#74304f; --ev-grey:#383838;
  --sw-red:#dc4c3e; --sw-orange:#eb8909; --sw-yellow:#d6b30f; --sw-green:#299438; --sw-teal:#14aaa6; --sw-blue:#4073ff;
  --sw-purple:#884dff; --sw-pink:#e05194; --sw-grey:#808080;
  --ease:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.22,.61,.36,1); --dur:.2s;
  --r:8px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#ffffff; --side:#fcfaf8; --card:#ffffff; --card-h:#fafafa; --line:#e8e8e8; --line2:#dcdcdc;
  --text:#202020; --muted:#666; --faint:#9a9a9a; --accent-text:#dc4c3e; --sel:#ffefe5; --hover:#f3f1ef;
  --input:#fff; --menu:#fff; --overlay:rgba(0,0,0,.35); --shadow:0 12px 40px rgba(0,0,0,.18);
  --c-today:#058527; --c-tom:#ad6200; --c-week:#692ec2; --c-over:#d1453b;
  --p1:#d1453b; --p2:#eb8909; --p3:#246fe0; --p4:#999;
  --ev-text:#202020; --ev-red:#f5d3cf; --ev-orange:#fae0bd; --ev-yellow:#f3eab4; --ev-green:#d1ecd5; --ev-teal:#cdeceb;
  --ev-blue:#d6e3fb; --ev-purple:#e5dafa; --ev-pink:#f7d5e6; --ev-grey:#ececec;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--accent-text)}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.i-sm{width:12px;height:12px}
.hidden{display:none!important}

/* ---------- layout ---------- */
#app{display:flex;height:100vh;height:100dvh}
.sidebar{width:268px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:10px 10px 12px;overflow-y:auto;border-right:1px solid transparent}
:root[data-theme=light] .sidebar{border-right-color:var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.side-top{display:flex;align-items:center;gap:6px;padding:2px 2px 8px}
.user-btn{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;font-weight:600;min-width:0;flex:1}
.user-btn:hover{background:var(--hover)}
.user-btn span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none;background:var(--sw-grey);letter-spacing:.02em}
.avatar.sm{width:18px;height:18px;font-size:8.5px}
.icon-btn{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:6px;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.add-task-btn{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:6px;color:var(--accent-text);font-weight:600}
.add-task-btn .plus{width:20px;height:20px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff}
.add-task-btn .plus .i{width:13px;height:13px;stroke-width:2.6}
.add-task-btn:hover{background:var(--hover)}
.nav-item{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:6px;color:var(--text);width:100%;text-align:left;min-height:32px}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--sel);color:var(--accent-text)}
.nav-item .i{color:var(--muted)}
.nav-item.active .i{color:var(--accent-text)}
.nav-item .cnt{margin-left:auto;color:var(--faint);font-size:12px}
.nav-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-group{margin-top:14px}
.side-group-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;color:var(--muted);font-weight:600;border-radius:6px}
.side-group-head .icon-btn{width:24px;height:24px;opacity:0}
.side-group-head:hover .icon-btn{opacity:1}
.proj-item{position:relative}
.proj-item .hash{font-weight:600;font-size:15px;width:16px;text-align:center;line-height:1}
.proj-item .more{position:absolute;right:2px;top:2px;opacity:0;width:28px;height:28px}
.proj-item:hover .more{opacity:1}
.proj-item:hover .cnt{visibility:hidden}
.side-foot{margin-top:auto;padding-top:14px}
.mode-note{font-size:11.5px;color:var(--faint);padding:8px 6px;border-top:1px solid var(--line);line-height:1.45}
.mode-note b{color:var(--muted);font-weight:600}

.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px 0;min-height:44px}
.crumb{color:var(--muted);font-size:12.5px}
.topbar .spacer{flex:1}
.top-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;color:var(--muted);font-size:12.5px}
.top-btn:hover{background:var(--hover);color:var(--text)}
.top-btn.on{color:var(--accent-text)}
.menu-toggle{display:none}
.content{flex:1;overflow:auto;padding:4px 24px 24px}
.page-head{padding:6px 0 18px}
.page-head h1{font-size:20px;margin:0;font-weight:700;display:inline-block;border-radius:6px;padding:1px 4px;margin-left:-4px}
.page-head h1.editable:hover{background:var(--hover);cursor:text}
.page-desc{color:var(--muted);font-size:12.5px;margin-top:4px;cursor:text;display:inline-block;padding:1px 4px;margin-left:-4px;border-radius:5px;white-space:pre-wrap}
.page-desc:hover{background:var(--hover)}
.page-desc.empty{color:var(--faint)}

/* ---------- board ---------- */
.board{display:flex;align-items:flex-start;gap:14px;padding-bottom:20px;min-height:calc(100% - 90px)}
.col{width:272px;flex:none;display:flex;flex-direction:column;border-radius:10px}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 4px 8px 4px;min-height:34px}
.col-head h3{margin:0;font-size:13px;font-weight:700;cursor:text;padding:1px 3px;border-radius:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-head h3:hover{background:var(--hover)}
.col-head .col-count{color:var(--faint);font-size:12px}
.col-head .icon-btn{margin-left:auto;width:26px;height:26px}
.cards{display:flex;flex-direction:column;gap:8px;min-height:6px;padding:1px;border-radius:10px}
.cards.drag-over{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.card{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 10px;cursor:pointer;transition:border-color .12s,box-shadow .12s;user-select:none}
.card:hover{border-color:var(--line2);box-shadow:0 1px 6px rgba(0,0,0,.25)}
.card.dragging{opacity:.4}
.card.done .card-title{text-decoration:line-through;color:var(--faint)}
.card-body{flex:1;min-width:0}
.card-title{font-size:13px;line-height:1.35;word-wrap:break-word}
.card-desc{color:var(--muted);font-size:11.5px;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:pre-line}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:3px}
.meta .i{width:12px;height:12px}
.d-today{color:var(--c-today)!important}.d-tomorrow{color:var(--c-tom)!important}.d-week{color:var(--c-week)!important}.d-overdue{color:var(--c-over)!important}
.meta .assignee{margin-left:auto}
.drop-line{height:3px;border-radius:3px;background:var(--accent);margin:-5px 2px}
.check{width:18px;height:18px;border-radius:50%;border:1.6px solid var(--p4);display:grid;place-items:center;flex:none;margin-top:0;color:transparent;transition:background .12s,color .12s}
.check .i{width:11px;height:11px;stroke-width:3}
.check:hover{color:var(--p4)}
.check.p1{border-color:var(--p1);background:color-mix(in srgb,var(--p1) 12%,transparent)}.check.p1:hover{color:var(--p1)}
.check.p2{border-color:var(--p2);background:color-mix(in srgb,var(--p2) 12%,transparent)}.check.p2:hover{color:var(--p2)}
.check.p3{border-color:var(--p3);background:color-mix(in srgb,var(--p3) 12%,transparent)}.check.p3:hover{color:var(--p3)}
.check.checked,.card.done .check{background:var(--p4);border-color:var(--p4);color:#fff}
.check.p1.checked{background:var(--p1)}.check.p2.checked{background:var(--p2)}.check.p3.checked{background:var(--p3)}
.add-inline{display:flex;align-items:center;gap:8px;color:var(--muted);padding:8px 6px;border-radius:6px;width:100%;text-align:left}
.add-inline .i{color:var(--accent-text)}
.add-inline:hover{color:var(--accent-text)}
.inline-add{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:8px;margin-top:8px;display:flex;flex-direction:column;gap:4px}
.inline-add input.bare{background:transparent;border:0;outline:0;padding:3px 2px;width:100%}
.inline-add input.bare.t{font-weight:600}
.inline-add input.bare.d{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;color:var(--muted);font-size:12px;background:transparent}
.chip input,.chip select{background:transparent;border:0;outline:0;color:var(--text);font-size:12px;padding:0;max-width:130px}
.chip select option{background:var(--menu)}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.btn{padding:6px 12px;border-radius:6px;font-weight:600;font-size:12.5px;background:var(--hover);color:var(--text)}
.btn:hover{filter:brightness(1.15)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-h);filter:none}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-danger{color:var(--c-over);background:transparent;padding-left:4px}
.btn-danger:hover{background:var(--hover)}
.add-section{width:272px;flex:none;display:flex;align-items:center;gap:8px;color:var(--muted);padding:8px 10px;border-radius:8px;border:1px dashed transparent}
.add-section:hover{color:var(--accent-text);border-color:var(--line2)}
.add-section-form{width:272px;flex:none}
.add-section-form input{width:100%;background:var(--input);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;outline:0;font-weight:600}
.add-section-form input:focus{border-color:var(--faint)}
.empty-state{color:var(--faint);padding:40px 0;text-align:center}

/* ---------- list (today) ---------- */
.list{max-width:820px}
.group-head{display:flex;align-items:center;gap:8px;font-weight:700;padding:14px 0 8px;border-bottom:1px solid var(--line)}
.group-head .cnt{color:var(--faint);font-weight:400;font-size:12px}
.group-head .link{margin-left:auto;color:var(--accent-text);font-weight:500;font-size:12.5px}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover .card-title{color:var(--text)}
.row .card-body{min-width:0}
.row .where{margin-left:auto;color:var(--faint);font-size:11.5px;white-space:nowrap;align-self:flex-end;display:flex;align-items:center;gap:3px;padding-left:10px}
.off-today{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 6px;color:var(--muted);font-size:12px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;padding:6px 0 12px}
.cal-head h1{font-size:20px;margin:0}
.cal-head .sub{font-weight:700;font-size:12.5px;margin-top:2px}
.cal-controls{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{padding:4px 9px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center}
.seg button:hover{background:var(--hover);color:var(--text)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{color:var(--text);background:var(--hover)}
.cal{border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{text-align:center;color:var(--muted);font-size:11.5px;padding:6px 0 7px;border-bottom:1px solid var(--line)}
.cal-cell{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 3px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:default}
.cal-cell:nth-child(7n+7){border-right:0}
.cal-cell.drag-over{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.cal-cell .dnum{align-self:flex-end;font-size:11.5px;font-weight:600;padding:1px 5px;min-width:22px;text-align:center;border-radius:10px;color:var(--text)}
.cal-cell.other .dnum{color:var(--faint);font-weight:400}
.cal-cell.today .dnum{background:var(--accent);color:#fff}
.cal-cell.weekend{background:color-mix(in srgb,var(--side) 35%,transparent)}
.cal-item{display:flex;align-items:center;gap:5px;width:100%;text-align:left;border-radius:4px;padding:2px 5px;font-size:11px;line-height:1.35;color:var(--ev-text);background:var(--ev-grey);min-width:0;cursor:pointer}
.cal-item:hover{filter:brightness(1.15)}
:root[data-theme=light] .cal-item:hover{filter:brightness(.96)}
.cal-item .ring{width:9px;height:9px;border-radius:50%;border:1.3px solid currentColor;flex:none;opacity:.85}
.cal-item .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-item .tm{flex:none;opacity:.8;font-size:10.5px}
.cal-item.task{background:transparent;border:1px solid var(--line2);color:var(--text)}
.cal-item.task .ring.p1{color:var(--p1)}.cal-item.task .ring.p2{color:var(--p2)}.cal-item.task .ring.p3{color:var(--p3)}
.cal-more{font-size:11px;color:var(--muted);text-align:left;padding:1px 5px;border-radius:4px}
.cal-more:hover{background:var(--hover);color:var(--text)}
.ev-red{background:var(--ev-red)}.ev-orange{background:var(--ev-orange)}.ev-yellow{background:var(--ev-yellow)}.ev-green{background:var(--ev-green)}
.ev-teal{background:var(--ev-teal)}.ev-blue{background:var(--ev-blue)}.ev-purple{background:var(--ev-purple)}.ev-pink{background:var(--ev-pink)}.ev-grey{background:var(--ev-grey)}
.sw-red{background:var(--sw-red)}.sw-orange{background:var(--sw-orange)}.sw-yellow{background:var(--sw-yellow)}.sw-green{background:var(--sw-green)}
.sw-teal{background:var(--sw-teal)}.sw-blue{background:var(--sw-blue)}.sw-purple{background:var(--sw-purple)}.sw-pink{background:var(--sw-pink)}.sw-grey{background:var(--sw-grey)}
.tx-red{color:var(--sw-red)}.tx-orange{color:var(--sw-orange)}.tx-yellow{color:var(--sw-yellow)}.tx-green{color:var(--sw-green)}
.tx-teal{color:var(--sw-teal)}.tx-blue{color:var(--sw-blue)}.tx-purple{color:var(--sw-purple)}.tx-pink{color:var(--sw-pink)}.tx-grey{color:var(--sw-grey)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;color:var(--muted);font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px;z-index:70;overflow-y:auto}
.modal{background:var(--menu);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:460px;display:flex;flex-direction:column}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;gap:8px;padding:12px 14px 10px 16px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:14px;margin:0;font-weight:700;flex:1;min-width:0}
.modal-head .crumb{flex:1;display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;white-space:nowrap}
.modal-body{padding:14px 16px}
.modal-foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.modal-foot .spacer{flex:1}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label,.lbl-sm{font-size:11.5px;color:var(--muted);font-weight:600}
.inp,.sel,.ta{width:100%;background:var(--input);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;outline:0}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--faint)}
.ta{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;outline:2px solid transparent}
.swatch.on{outline-color:var(--text);border-color:var(--menu)}
.tm-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px}
.tm-main{padding:16px 18px;min-width:0}
.tm-side{background:color-mix(in srgb,var(--side) 60%,var(--menu));border-left:1px solid var(--line);padding:14px 14px;border-radius:0 0 12px 0}
.tm-title-row{display:flex;gap:10px;align-items:flex-start}
.tm-title-row .check{margin-top:4px}
.tm-title{flex:1;background:transparent;border:0;outline:0;font-size:17px;font-weight:700;padding:0;resize:none;overflow:hidden;line-height:1.35}
.tm-desc{width:100%;background:transparent;border:0;outline:0;resize:none;color:var(--text);padding:6px 0 0 28px;min-height:40px;font-size:13px;line-height:1.5}
.tm-desc::placeholder,.tm-title::placeholder{color:var(--faint)}
.tm-sec{margin-top:16px;padding-left:28px}
.tm-sec h4{margin:0 0 6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sub-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.sub-row .check{width:16px;height:16px}
.sub-row input.bare{flex:1;background:transparent;border:0;outline:0;padding:0}
.sub-row.done input.bare{text-decoration:line-through;color:var(--faint)}
.sub-row .icon-btn{width:22px;height:22px;opacity:0}
.sub-row:hover .icon-btn{opacity:1}
.sub-add{display:flex;gap:8px;align-items:center;padding:6px 0;color:var(--muted)}
.sub-add input{flex:1;background:transparent;border:0;outline:0;padding:0}
.comment{display:flex;gap:9px;padding:8px 0}
.comment .c-body{flex:1;min-width:0}
.comment .c-meta{font-size:11.5px;color:var(--faint)}
.comment .c-meta b{color:var(--text);font-weight:600;margin-right:6px}
.comment .c-text{white-space:pre-wrap;word-wrap:break-word;margin-top:1px}
.comment-box{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.comment-box textarea{flex:1;min-height:34px;height:34px;resize:vertical}
.prop{padding:8px 0;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:0}
.prop .lbl-sm{display:block;margin-bottom:5px}
.prop .inp,.prop .sel{padding:5px 7px;font-size:12.5px}
.prop .inline{display:flex;gap:6px;align-items:center}
.prop .hint{font-size:11px;color:var(--faint);margin-top:4px}
.clear-x{color:var(--faint);width:22px;height:22px;display:grid;place-items:center;border-radius:5px;flex:none}
.clear-x:hover{background:var(--hover);color:var(--text)}
.tm-foot-info{font-size:11px;color:var(--faint)}

.menu{position:fixed;z-index:90;background:var(--menu);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:5px;min-width:190px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;border-radius:5px;font-size:12.5px}
.menu button:hover{background:var(--hover)}
.menu button .i{color:var(--muted)}
.menu button.danger{color:var(--c-over)}
.menu button.danger .i{color:var(--c-over)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .menu-title{font-size:11px;color:var(--faint);padding:4px 9px 2px;font-weight:600}

#toasts{position:fixed;left:18px;bottom:18px;z-index:95;display:flex;flex-direction:column;gap:8px}
.toast{background:#333;color:#f2f2f2;border-radius:8px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);font-size:12.5px;animation:tin .18s ease-out}
.toast button{color:#ff8a7e;font-weight:600}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

.search-list{max-height:55vh;overflow:auto;margin:0 -16px;padding:0 16px}
.search-list .row:last-child{border-bottom:0}
.set-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.set-row .inp{padding:5px 8px}
.set-row .dot{width:14px;height:14px;border-radius:4px;flex:none;cursor:pointer;border:0}
.set-h{font-size:12.5px;font-weight:700;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.set-h:first-child{margin-top:0}
.set-p{color:var(--muted);font-size:12px;margin:0 0 8px;line-height:1.5}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:360px;background:var(--menu);border:1px solid var(--line2);border-radius:14px;padding:26px 24px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;margin-bottom:18px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.auth-card .btn-primary{width:100%;padding:9px;margin-top:4px}
.auth-links{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.auth-links button{color:var(--accent-text)}
.auth-msg{font-size:12.5px;padding:8px 10px;border-radius:6px;background:var(--hover);margin-bottom:12px;line-height:1.45}
.auth-msg.err{color:var(--c-over)}
.loading{height:100vh;display:grid;place-items:center;color:var(--faint)}

/* ---------- responsive ---------- */
.scrim{display:none}
@media (max-width:820px){
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:var(--overlay);z-index:30}
  .menu-toggle{display:inline-grid}
  .topbar{padding:8px 12px 0}
  .content{padding:4px 16px 20px}
  .col,.add-section,.add-section-form{width:82vw;max-width:300px}
  .board{scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .cal-cell{min-height:74px;padding:2px 1px 4px}
  .cal-item{font-size:9.5px;padding:1px 3px;gap:3px}
  .cal-item .ring,.cal-item .tm{display:none}
  .cal-dow{font-size:10.5px}
  .tm-grid{grid-template-columns:1fr}
  .tm-side{border-left:0;border-top:1px solid var(--line);border-radius:0 0 12px 12px}
  .overlay{padding-top:4vh}
  .row2{grid-template-columns:1fr}
}

/* ===================== motion ===================== */
.icon-btn,.nav-item,.btn,.top-btn,.add-inline,.chip,.cal-item,.seg button,.menu button{transition:background-color .16s var(--ease-out),color .16s var(--ease-out),border-color .16s var(--ease-out),transform .12s var(--ease-out),opacity .16s}
.icon-btn:active,.btn:active,.top-btn:active,.seg button:active{transform:scale(.94)}
.card{transition:border-color .16s var(--ease-out),box-shadow .18s var(--ease-out),transform .18s var(--ease)}
.card:hover{transform:translateY(-1px)}
.card:active{transform:scale(.994)}
.card.dragging{opacity:.35;transform:scale(.98) rotate(.4deg)}
.check{transition:background-color .18s var(--ease-out),border-color .18s var(--ease-out),color .18s var(--ease-out),transform .18s var(--ease)}
.check:active{transform:scale(.88)}
.check.checked{animation:pop .28s var(--ease)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.overlay{animation:fade .18s var(--ease-out);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay>.modal{animation:modalIn .3s var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}}
.menu{animation:menuIn .16s var(--ease-out);transform-origin:top left}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.97)}}
.toast{animation:toastIn .3s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
.route-enter{animation:viewIn .26s var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}
.col-drop{position:relative}
.col-drop::before{content:"";position:absolute;left:-8px;top:0;bottom:0;width:3px;border-radius:3px;background:var(--accent);animation:fade .12s}
.col-drop.after::before{left:auto;right:-8px}
.col.dragging{opacity:.4}
.col-head{border-radius:6px}
.col-head[data-sechead]:active{cursor:grabbing}
.col-head:hover{background:color-mix(in srgb,var(--hover) 60%,transparent)}
.proj-item.drop-above{box-shadow:inset 0 2px 0 var(--accent)}
.proj-item.drop-below{box-shadow:inset 0 -2px 0 var(--accent)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===================== campaign tracker ===================== */
.ct-head{padding:6px 0 10px}
.ct-head h1{font-size:20px;margin:0;font-weight:700}
.ct-tabs{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.ct-tab{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:7px;color:var(--muted);white-space:nowrap;border:1px solid transparent;font-size:12.5px}
.ct-tab:hover{background:var(--hover);color:var(--text)}
.ct-tab.on{background:var(--sel);color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 28%,transparent);font-weight:600}
.ct-tab .n{font-size:11px;color:var(--faint);background:var(--hover);border-radius:9px;padding:0 6px;line-height:16px}
.ct-tab.on .n{color:var(--accent-text);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ct-tab .warn{width:6px;height:6px;border-radius:50%;background:var(--sw-orange)}
.ct-tab.dragging{opacity:.4}
.ct-tab.tab-drop{box-shadow:inset 2px 0 0 var(--accent)}
.ct-tab.tab-drop.after{box-shadow:inset -2px 0 0 var(--accent)}
.ct-summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--card) 60%,transparent);margin-bottom:12px}
.ct-stat{display:inline-flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--muted)}
.ct-stat b{font-size:14px;color:var(--text);font-weight:700}
.ct-stat.alert b{color:var(--sw-orange)}
.ct-sumsep{width:1px;align-self:stretch;background:var(--line)}
.ct-sumchips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11.5px;color:var(--muted)}
.ct-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.ct-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.ct-search{position:relative;flex:1;min-width:180px;max-width:320px}
.ct-search .i{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint)}
.ct-search input{width:100%;background:var(--input);border:1px solid var(--line2);border-radius:7px;padding:6px 9px 6px 30px;outline:0}
.ct-search input:focus{border-color:var(--faint)}
.filt{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);border-radius:7px;padding:4px 6px;font-size:12px;color:var(--muted);background:transparent}
.filt select{background:transparent;border:0;outline:0;color:var(--text);font-size:12px;max-width:130px}
.filt select option{background:var(--menu)}
.filt.on{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-text)}
.ct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;padding-bottom:24px}
/* long lists: let the browser skip layout/paint for cards that are scrolled out of view */
.ct-card{content-visibility:auto;contain-intrinsic-size:auto 186px}
.ct-card{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:11px 12px 10px 26px;cursor:pointer;overflow:hidden;
  transition:border-color .16s var(--ease-out),box-shadow .18s var(--ease-out),transform .18s var(--ease)}
.ct-card:hover{border-color:var(--line2);box-shadow:0 2px 10px rgba(0,0,0,.22);transform:translateY(-1px)}
:root[data-theme=light] .ct-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.ct-card.attention::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--sw-orange);opacity:.85}
.ct-card.ended{opacity:.6}
.ct-card.ended:hover{opacity:.85}
.ct-card.archived{opacity:.45}
.ct-top{display:flex;align-items:flex-start;gap:8px}
.ct-name{font-size:13.5px;font-weight:700;line-height:1.3;flex:1;min-width:0;word-wrap:break-word}
.ct-acc{font-size:11px;color:var(--faint);margin-top:2px}
.ct-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;flex:none}
.ct-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.ct-status.live{color:var(--c-today);border-color:color-mix(in srgb,var(--c-today) 35%,transparent);background:color-mix(in srgb,var(--c-today) 10%,transparent)}
.ct-status.pending{color:var(--sw-orange);border-color:color-mix(in srgb,var(--sw-orange) 35%,transparent);background:color-mix(in srgb,var(--sw-orange) 10%,transparent)}
.ct-status.ended{color:var(--faint)}
.ct-dates{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:7px}
.ct-dates .soon{color:var(--sw-orange)}
.ct-desc{font-size:11.5px;color:var(--muted);margin-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.ct-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-size:10.5px;letter-spacing:.02em;padding:2px 6px;border-radius:5px;background:var(--hover);color:var(--muted);border:1px solid transparent;white-space:nowrap}
.tag.mkt{color:var(--text);background:color-mix(in srgb,var(--sw-blue) 14%,transparent)}
.tag.plat{color:var(--text);background:color-mix(in srgb,var(--sw-purple) 14%,transparent)}
.tag.more{background:transparent;border-color:var(--line2);color:var(--faint)}
.ct-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.ct-m{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:3px 5px;border-radius:6px;min-width:0;text-align:left;width:100%}
.ct-m:hover{background:var(--hover)}
.ct-m .i{width:13px;height:13px;flex:none}
.ct-m .v{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-m.good .i{color:var(--c-today)}
.ct-m.warn .i,.ct-m.warn .v{color:var(--sw-orange)}
.ct-m.bad .i,.ct-m.bad .v{color:var(--c-over)}
.ct-notes{display:flex;gap:6px;align-items:flex-start;margin-top:8px;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px}
.ct-notes .txt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.ct-empty{padding:40px 10px;text-align:center;color:var(--faint)}
.ct-banner{display:flex;gap:10px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--sw-orange) 40%,transparent);background:color-mix(in srgb,var(--sw-orange) 10%,transparent);border-radius:9px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.5}
.ct-banner .i{color:var(--sw-orange);margin-top:1px}

/* drawer */
.drawer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:var(--overlay);animation:fade .18s var(--ease-out)}
.drawer-panel{width:min(480px,100%);background:var(--menu);border-left:1px solid var(--line2);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:drawerIn .34s var(--ease)}
@keyframes drawerIn{from{transform:translateX(24px);opacity:.4}}
.drawer-head{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 12px 16px;border-bottom:1px solid var(--line)}
.drawer-body{flex:1;overflow-y:auto;padding:14px 16px 20px}
.drawer-foot{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.d-sec{margin-top:16px}
.d-sec:first-child{margin-top:0}
.d-sec h4{margin:0 0 7px;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.d-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.d-row .k{color:var(--muted);width:120px;flex:none}
.d-row .v{flex:1;min-width:0}
.d-text{font-size:12.5px;line-height:1.6;white-space:pre-wrap;color:var(--text)}
.wk{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.wk .when{flex:1}
.wk .who{color:var(--faint);font-size:11px}
.wk .icon-btn{opacity:0}
.wk:hover .icon-btn{opacity:1}
.wk .tick{color:var(--c-today)}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--muted);transition:all .14s var(--ease-out)}
.pick:hover{border-color:var(--faint);color:var(--text)}
.pick.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--text);font-weight:600}
.pick.on.good{background:color-mix(in srgb,var(--c-today) 15%,transparent);border-color:color-mix(in srgb,var(--c-today) 45%,transparent)}
.pick.on.warn{background:color-mix(in srgb,var(--sw-orange) 15%,transparent);border-color:color-mix(in srgb,var(--sw-orange) 45%,transparent)}
.pick.on.bad{background:color-mix(in srgb,var(--c-over) 15%,transparent);border-color:color-mix(in srgb,var(--c-over) 45%,transparent)}
.pick.on.mute{background:var(--hover);border-color:var(--line2);color:var(--muted)}
.pick.locked{opacity:.4;cursor:not-allowed}
.pick.locked:hover{border-color:var(--line2);color:var(--muted)}
.ct-card.drop-l{box-shadow:inset 3px 0 0 var(--accent),0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.ct-card.drop-r{box-shadow:inset -3px 0 0 var(--accent),0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.ct-card.dragging{opacity:.35}
.drag-ghost{opacity:.92;border-radius:10px;box-shadow:0 22px 60px rgba(0,0,0,.55);transform-origin:center;
  transition:none!important;animation:none!important;cursor:grabbing;overflow:hidden}
.drag-ghost .ct-grip,.drag-ghost .icon-btn{opacity:0}
.col-head[data-sechead]{cursor:grab}
.ct-tab[data-tab]{cursor:grab}
.proj-item{cursor:grab}
.card{cursor:pointer}
.ct-grip{position:absolute;left:3px;top:9px;width:18px;height:22px;display:grid;place-items:center;color:var(--faint);border-radius:5px;opacity:0;cursor:grab;transition:opacity .15s var(--ease-out),background-color .15s}
.ct-card:hover .ct-grip,.ct-grip:focus-visible{opacity:1}
.ct-grip:hover{background:var(--hover);color:var(--text)}
.ct-grip:active{cursor:grabbing}
.ct-grip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (hover:none){.ct-grip{opacity:.7}}
body.dragging-active{user-select:none;-webkit-user-select:none}
body.dragging-active .ct-card{cursor:grabbing}
.ct-m.mute .i{color:var(--faint)}
.ct-m.mute .v{color:var(--muted)}
.seg-pick{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:820px){
  .ct-grid{grid-template-columns:1fr}
  .ct-summary{gap:6px 12px}
  .ct-sumsep{display:none}
  .drawer-panel{width:100%}
  .ct-search{max-width:none;flex:1 1 100%}
  .ct-filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .ct-filters .filt{flex:none}
  .ct-toolbar .btn-primary{flex:1}
}
</style>

<body>
<div id="root"><div class="loading">Loading…</div></div>
<div id="modals"></div>
<div id="toasts"></div>
<script type="module">
/* ===================== utilities ===================== */
const CFG = window.APP_CONFIG || {};
const BUILD = '2026-09-17b';   // shown in Settings, so you can confirm which version is live
const FB_URL = 'https://www.gstatic.com/firebasejs/10.12.2/';
const COLS = ['projects', 'sections', 'tasks', 'events', 'meta', 'members', 'accounts', 'campaigns'];
// Collections added after the first release. If the security rules haven't been updated yet,
// the app still runs — only the Campaign Tracker shows a notice.
const OPTIONAL_COLS = ['accounts', 'campaigns'];
const COLORS = ['red', 'orange', 'yellow', 'green', 'teal', 'blue', 'purple', 'pink', 'grey'];
const MARKETS = ['KSA', 'UAE', 'QAT', 'KWT', 'BAH', 'OMN'];
const PLATFORMS = ['Search', 'PMax', 'YouTube', 'Meta', 'Snap', 'TikTok', 'LinkedIn', 'X'];
const C_STATUS = ['Live', 'Pending', 'Ended'];
const C_PACING = ['Pending', 'Healthy', 'Under-pacing', 'Over-pacing', 'Unstable'];
const C_CREATIVE = ['All Live', 'Partially Missing', 'Fully Missing'];
const C_RESULTS = ['Pending', 'Healthy', 'Needs Attention'];
const DEFAULT_TYPES = [
  { id: 'ooo', name: 'OOO', color: 'red' },
  { id: 'remote', name: 'Work remotely', color: 'orange' },
  { id: 'office', name: 'Office day', color: 'blue' },
  { id: 'other', name: 'Other', color: 'grey' },
];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { } };

const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const dayDiff = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);

class LocalStore {
  constructor() {
    this.key = 'tb:data:v1';
    const raw = lsGet(this.key);
    if (raw) { try { const d = JSON.parse(raw); COLS.forEach(c => S.data[c] = d[c] || {}); } catch { } }
    window.addEventListener('storage', e => { if (e.key === this.key && e.newValue) { const d = JSON.parse(e.newValue); COLS.forEach(c => S.data[c] = d[c] || {}); this.cb && this.cb(); } });
  }
  start(cb) { this.cb = cb; cb(); }
  save() { lsSet(this.key, JSON.stringify(S.data)); this.cb && this.cb(); }
  async put(col, obj) { S.data[col][obj.id] = clone(obj); this.save(); }
  async update(col, id, fields) { if (!S.data[col][id]) return; Object.assign(S.data[col][id], clone(fields)); this.save(); }
  async del(col, id) { delete S.data[col][id]; this.save(); }
  async batch(ops) {
    for (const o of ops) {
      if (o.type === 'put') S.data[o.col][o.data.id] = clone(o.data);
      else if (o.type === 'update') { if (S.data[o.col][o.id]) Object.assign(S.data[o.col][o.id], clone(o.data)); }
      else if (o.type === 'del') delete S.data[o.col][o.id];
    }
    this.save();
  }
}

class CloudStore {
  constructor(fs, db) { this.fs = fs; this.db = db; this.unsubs = []; }
  start(cb, onErr) {
    const loaded = new Set(); this.fresh = new Set(); let raf = 0;
    const fire = () => { if (loaded.size < COLS.length) return; cancelAnimationFrame(raf); raf = requestAnimationFrame(cb); };
    COLS.forEach(col => {
      // includeMetadataChanges lets us know when data has been confirmed by the server (never seed over real data)
      this.unsubs.push(this.fs.onSnapshot(this.fs.collection(this.db, col), { includeMetadataChanges: true }, snap => {
        const known = loaded.has(col);
        if (!snap.metadata.fromCache) this.fresh.add(col);
        const changed = typeof snap.docChanges === 'function' ? snap.docChanges().length : 1;
        if (known && !changed) return;   // metadata-only echo: nothing to repaint
        const m = {}; snap.forEach(d => { m[d.id] = { ...d.data(), id: d.id }; });
        S.data[col] = m; loaded.add(col); fire();
      }, err => {
        // A newer collection the security rules don't cover yet must not lock the whole app out.
        if (OPTIONAL_COLS.includes(col) && err.code === 'permission-denied') {
          S.rulesMissing = true; S.data[col] = {}; loaded.add(col); this.fresh.add(col); fire(); return;
        }
        onErr && onErr(err);
      }));
    });
  }
  isFresh() { return this.fresh && this.fresh.size >= COLS.length; }
  stop() { this.unsubs.forEach(u => u()); this.unsubs = []; }
  ref(col, id) { return this.fs.doc(this.db, col, id); }
  async put(col, obj) { return this.fs.setDoc(this.ref(col, obj.id), clone(obj)).catch(writeErr); }
  async update(col, id, fields) { return this.fs.updateDoc(this.ref(col, id), clone(fields)).catch(writeErr); }
  async del(col, id) { return this.fs.deleteDoc(this.ref(col, id)).catch(writeErr); }
  async batch(ops) {
    for (let i = 0; i < ops.length; i += 400) {
      const b = this.fs.writeBatch(this.db);
      ops.slice(i, i + 400).forEach(o => {
        if (o.type === 'put') b.set(this.ref(o.col, o.data.id), clone(o.data));
        else if (o.type === 'update') b.update(this.ref(o.col, o.id), clone(o.data));
        else if (o.type === 'del') b.delete(this.ref(o.col, o.id));
      });
      await b.commit().catch(writeErr);
    }
  }
}
function writeErr(e) {
  console.error(e);
  if (e && e.code === 'permission-denied' && S.rulesMissing) { toast('Campaign Tracker needs the updated security rules — see the notice at the top.'); return; }
  toast(e && e.code === 'permission-denied' ? "You don't have permission to change this." : 'Could not save — check your connection.');
}

  if (x + mw > innerWidth - 8) x = innerWidth - mw - 8; if (x < 8) x = 8;

function render(opts = {}) {
  if (!S.ready) return;
  // Never rebuild the page while something is being dragged: replacing the DOM destroys
  // the element the browser is carrying, so the drag never ends and the page feels frozen.
  // Anything that arrives mid-drag is painted the moment the drag finishes.
  if (S.drag) {
    if (Date.now() - (S.dragAt || 0) < 4000) { S.renderPending = true; return; }
    resetDrag();   // stale drag state (a dragend we never heard about) — clean up and carry on
  }
  // don't blow away a half-typed inline form: capture & restore
  const keep = {}; let focusId = null, selStart = null;
  $$('[data-keep]').forEach(el => keep[el.id] = el.value);
  const ae = document.activeElement;
  if (ae && ae.id && ae.hasAttribute('data-keep')) { focusId = ae.id; try { selStart = ae.selectionStart; } catch { } }
  const board = $('#board'), scrollL = board ? board.parentElement.scrollLeft : 0;
  const content = $('.content'), scrollT = content ? content.scrollTop : 0;

  const r = route(); S.route = r;
  const routeChanged = S.lastRouteKey !== (r.view + (r.id || ''));
  S.lastRouteKey = r.view + (r.id || '');
  // View-only changes (filters, search, sort, account tabs) repaint the main pane only —
  // the sidebar and its counts don't change, so there's no reason to rebuild them.
  const main = $('.main');

  else $('#root').innerHTML = `<div id="app">${renderSidebar(r)}<div class="scrim" data-action="close-nav"></div><main class="main">${renderMain(r)}</main></div>`;

  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.value = v; });
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch { } } }
  const nb = $('#board'); if (nb) nb.parentElement.scrollLeft = scrollL;
  const nc = $('.content'); if (nc) { nc.scrollTop = routeChanged ? 0 : scrollT; if (routeChanged) nc.classList.add('route-enter'); }
  if (S.drawerPaint) S.drawerPaint();
  document.title = (r.view === 'project' ? S.data.projects[r.id]?.name + ' – ' : r.view === 'today' ? 'Today – ' : r.view === 'upcoming' ? 'Upcoming – ' : r.view === 'campaigns' ? 'Campaign Tracker – ' : '') + (CFG.appName || 'Tasks');
}

/* ---------- calendar ---------- */
// every day (within [from,to]) an event covers, honoring repeats and skipped days
function eventDays(ev, from, to) {
  const out = [];
  if (!ev.start) return out;
  const dur = Math.max(0, dayDiff(ev.start, ev.end || ev.start));
  const starts = [];
  const rep = ev.repeat && ev.repeat.type && ev.repeat.type !== 'none' ? ev.repeat : null;
  if (!rep) starts.push(ev.start);
  else {
    const anchor = parseKey(ev.start).getDate(); let s = ev.start, g = 0, i = 0;
    while (s <= to && g++ < 2000) {
      if (rep.until && s > rep.until) break;
      if (addDays(s, dur) >= from) starts.push(s);
      i++;
      s = rep.type === 'weekly' ? addDays(ev.start, 7 * (rep.every || 1) * i) : addMonths(ev.start, (rep.every || 1) * i, anchor);
    }
  }
  const skip = new Set(ev.skip || []);
  starts.forEach(s => { for (let k = 0; k <= dur; k++) { const d = addDays(s, k); if (d >= from && d <= to && !skip.has(d)) out.push(d); } });
  return out;
}
function calMonth() { if (!S.cal) { const d = new Date(); S.cal = { y: d.getFullYear(), m: d.getMonth() }; } return S.cal; }
function renderUpcoming() {
  const { y, m } = calMonth();
  const first = new Date(y, m, 1, 12); const startOffset = (first.getDay() + 6) % 7;
  const from = addDays(keyOf(first), -startOffset);
  const last = new Date(y, m, daysIn(y, m), 12); const endOffset = (7 - ((last.getDay() + 6) % 7) - 1);
  const to = addDays(keyOf(last), endOffset);
  const nDays = dayDiff(from, to) + 1;
  const byDay = {};
  const push = (d, item) => (byDay[d] = byDay[d] || []).push(item);
  if (S.calLeave) Object.values(S.data.events).forEach(ev => eventDays(ev, from, to).forEach(d => push(d, { kind: 'ev', ev, d })));
  if (S.calTasks) activeTasks().forEach(t => { if (t.due && t.due >= from && t.due <= to) push(t.due, { kind: 'task', t, d: t.due }); });
  const tk = todayKey();
  const cells = [];
  for (let i = 0; i < nDays; i++) {
    const d = addDays(from, i), dt = parseKey(d);
    const items = (byDay[d] || []).sort((a, b) => (a.kind === 'ev' ? 0 : 1) - (b.kind === 'ev' ? 0 : 1) || String(a.ev?.time || '').localeCompare(String(b.ev?.time || '')));
    const max = 4, shown = items.length > max + 1 ? items.slice(0, max) : items;
    const label = dt.getDate() === 1 ? `${dt.getDate()} ${MON[dt.getMonth()]}` : dt.getDate();
    cells.push(`<div class="cal-cell ${dt.getMonth() !== m ? 'other' : ''} ${d === tk ? 'today' : ''} ${[0, 6].includes(dt.getDay()) ? 'weekend' : ''}" data-day="${d}" data-action="cal-cell">
      <span class="dnum">${label}</span>
      ${shown.map(calItemHTML).join('')}
      ${items.length > shown.length ? `<button class="cal-more" data-action="cal-more" data-day="${d}">+${items.length - shown.length} more</button>` : ''}
    </div>`);
  }
  const typesUsed = types();
  return topbar('') + `<div class="content">
    <div class="cal-head"><div><h1>Upcoming</h1><div class="sub">${MONTHS[m]} ${y}</div></div>
      <div class="cal-controls">
        <div class="seg"><button class="${S.calTasks ? 'on' : ''}" data-action="cal-toggle" data-k="calTasks">${S.calTasks ? '✓ ' : ''}Tasks</button><button class="${S.calLeave ? 'on' : ''}" data-action="cal-toggle" data-k="calLeave">${S.calLeave ? '✓ ' : ''}Leave &amp; events</button></div>
        <div class="seg"><button data-action="cal-nav" data-n="-1" title="Previous month">${ico('left', 'i-sm')}</button><button data-action="cal-nav" data-n="0">Today</button><button data-action="cal-nav" data-n="1" title="Next month">${ico('right', 'i-sm')}</button></div>
        <button class="btn btn-primary" data-action="add-event">${ico('plus', 'i-sm')} Add leave</button>
      </div></div>
    <div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<div class="cal-dow">${x}</div>`).join('')}${cells.join('')}</div>
    <div class="legend">${typesUsed.map(t => `<span><i class="ev-${esc(t.color)}"></i>${esc(t.name)}</span>`).join('')}<span><i style="border:1px solid var(--line2)"></i>Task</span><span style="margin-left:auto">Click a day to add · drag items to move them</span></div>
  </div>`;
}

    const t = it.t;
    return `<button class="cal-item task" data-drag="task:${t.id}:${it.d}" data-action="open-task" data-id="${t.id}" title="${esc(t.title)}"><span class="ring p${t.priority || 4}"></span><span class="txt">${esc(t.title)}</span>${t.recur ? ico('repeat', 'i-sm') : ''}</button>`;

async function toggleTask(id, btn) {
  const t = S.data.tasks[id]; if (!t) return;
  if (t.done) return store.update('tasks', id, { done: false, completedAt: null });
  if (btn) { btn.classList.add('checked'); await sleep(200); }
  if (t.recur) {
    const prev = { due: t.due || null, deadline: t.deadline || null, subtasks: t.subtasks || [] };
    const next = rollForward(t.due, t.recur);
    const upd = { due: next, subtasks: (t.subtasks || []).map(s => ({ ...s, done: false })), lastDoneAt: Date.now(), lastDoneBy: me() };
    if (t.deadline && t.due) upd.deadline = addDays(t.deadline, dayDiff(t.due, next));
    await store.update('tasks', id, upd);
    toast(`Done — next one is ${longDay(next)}`, () => store.update('tasks', id, prev));
  } else {
    await store.update('tasks', id, { done: true, completedAt: Date.now(), completedBy: me() });
    toast('1 task completed', () => store.update('tasks', id, { done: false, completedAt: null }));
  }
}

async function deleteProject(p) {

/* =====================================================================
   DRAG & DROP — pointer based.
   The browser's native drag-and-drop can be left hanging (its element gets
   replaced, it's dropped outside the window, a pointer event is swallowed) and
   the page then feels frozen. This uses plain mouse/touch events instead: a
   release, an Escape, a lost window or a stale timer always ends it.
   ===================================================================== */
function clearDropUI() {
  $$('.drop-line').forEach(x => x.remove());
  $$('.drag-over,.col-drop,.drop-above,.drop-below,.tab-drop,.drop-l,.drop-r').forEach(x =>
    x.classList.remove('drag-over', 'col-drop', 'after', 'drop-above', 'drop-below', 'tab-drop', 'drop-l', 'drop-r'));
}
// Shared reorder: drop `dragId` before/after `targetId` and renumber the whole list.
async function reorderList(list, col, dragId, targetId, after) {
  const from = list.findIndex(x => x.id === dragId); if (from < 0) return;
  const moved = list[from]; const rest = list.filter(x => x.id !== dragId);
  let at = rest.findIndex(x => x.id === targetId); if (at < 0) at = rest.length; else if (after) at += 1;
  rest.splice(at, 0, moved);
  const ops = rest.map((x, i) => ({ type: 'update', col, id: x.id, data: { order: (i + 1) * 1000 } }))
    .filter((o, i) => rest[i].order !== o.data.order);
  if (ops.length) await store.batch(ops);
}
function edgeMark(el, after, cls) { clearDropUI(); el.classList.add(cls); if (after) el.classList.add('after'); }

// What can be dragged, and by which part of it. Order matters: most specific first.
const DRAGGABLES = [
  { kind: 'campaign', handle: '[data-grip]',   item: '[data-camp]', id: el => el.dataset.camp },
  { kind: 'cal',      handle: '[data-drag]',   item: '[data-drag]', id: el => el.dataset.drag, skip: el => el.hasAttribute('data-nodrag') },
  { kind: 'section',  handle: '[data-sechead]',item: '.col',        id: el => el.querySelector('[data-sechead]')?.dataset.sechead || el.dataset.sec,
    ignore: '.icon-btn' },
  { kind: 'tab',      handle: '[data-tab]',    item: '[data-tab]',  id: el => el.dataset.tab },
  { kind: 'project',  handle: '[data-proj]',   item: '[data-proj]', id: el => el.dataset.proj, ignore: '.more' },
  { kind: 'card',     handle: '[data-task]',   item: '[data-task]', id: el => el.dataset.task, ignore: '.check' },
];
let pd = null;              // pointer-drag state
let suppressClick = false;  // a completed drag must not also fire a click

function findDraggable(target) {
  for (const d of DRAGGABLES) {
    const h = target.closest && target.closest(d.handle);
    if (!h) continue;
    if (d.ignore && target.closest(d.ignore)) return null;
    const item = h.closest(d.item) || h;
    if (d.skip && d.skip(item)) return null;
    const id = d.id(item);
    if (!id) return null;
    return { kind: d.kind, item, id };
  }
  return null;
}
document.addEventListener('mousedown', e => {
  if (e.button !== 0 || topModal()) return;
  if (e.target.closest && e.target.closest('input,textarea,select,.menu')) return;
  const hit = findDraggable(e.target);
  if (!hit) return;
  pd = { ...hit, x0: e.clientX, y0: e.clientY, started: false, ghost: null, target: null, after: false, zone: null, idx: 0 };
});
function startPointerDrag(e) {
  pd.started = true;
  S.drag = { kind: pd.kind, id: pd.id, ref: pd.kind === 'cal' ? pd.id : undefined };
  S.dragAt = Date.now();
  const r = pd.item.getBoundingClientRect();
  const g = pd.item.cloneNode(true);
  g.classList.add('drag-ghost');
  g.style.cssText += `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;z-index:9999;pointer-events:none;`;
  document.body.appendChild(g);
  pd.ghost = g; pd.gx = r.left; pd.gy = r.top;
  pd.item.classList.add('dragging');
  document.body.classList.add('dragging-active');
  if (pd.kind === 'campaign') ctEnsureManualSort();
}
function autoScroll(e) {
  const box = $('.content'); if (!box) return;
  const r = box.getBoundingClientRect(), edge = 90;
  if (e.clientX > r.right - edge) box.scrollLeft += 18;
  else if (e.clientX < r.left + edge) box.scrollLeft -= 18;
  if (e.clientY > r.bottom - edge) box.scrollTop += 14;
  else if (e.clientY < r.top + edge) box.scrollTop -= 14;
}
function underPointer(e, sel) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return el && el.closest ? el.closest(sel) : null;
}
function updatePointerDrag(e) {
  S.dragAt = Date.now();
  pd.ghost.style.transform = `translate(${e.clientX - pd.x0}px, ${e.clientY - pd.y0}px)`;
  autoScroll(e);
  pd.target = null;
  if (pd.kind === 'section') {
    const col = underPointer(e, '.col'); if (!col || !col.dataset.sec) return clearDropUI();
    const r = col.getBoundingClientRect(); pd.after = e.clientX > r.left + r.width / 2;
    pd.target = col.dataset.sec; edgeMark(col, pd.after, 'col-drop');
  } else if (pd.kind === 'tab' || pd.kind === 'campaign' || pd.kind === 'project') {
    const sel = pd.kind === 'tab' ? '[data-tab]' : pd.kind === 'campaign' ? '[data-camp]' : '[data-proj]';
    const el = underPointer(e, sel); if (!el || el === pd.item) return clearDropUI();
    const r = el.getBoundingClientRect();
    const vertical = pd.kind === 'project';
    pd.after = vertical ? e.clientY > r.top + r.height / 2 : e.clientX > r.left + r.width / 2;
    pd.target = pd.kind === 'tab' ? el.dataset.tab : pd.kind === 'campaign' ? el.dataset.camp : el.dataset.proj;
    if (pd.kind === 'tab') edgeMark(el, pd.after, 'tab-drop');
    else if (pd.kind === 'campaign') { clearDropUI(); el.classList.add(pd.after ? 'drop-r' : 'drop-l'); }
    else { clearDropUI(); el.classList.add(pd.after ? 'drop-below' : 'drop-above'); }
  } else if (pd.kind === 'card') {
    const col = underPointer(e, '.col'); if (!col) return clearDropUI();
    const zone = col.querySelector('.cards'); if (!zone) return clearDropUI();
    const cards = $$('.card:not(.dragging)', zone);
    let idx = cards.findIndex(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
    if (idx < 0) idx = cards.length;
    pd.target = zone; pd.zone = zone; pd.idx = idx;          // keep the target even when the marker doesn't move
    if ($('.drop-line') && zone.classList.contains('drag-over') && pd.markIdx === idx) return;
    clearDropUI(); zone.classList.add('drag-over');
    const line = document.createElement('div'); line.className = 'drop-line';
    idx < cards.length ? zone.insertBefore(line, cards[idx]) : zone.appendChild(line);
    pd.markIdx = idx;
  } else if (pd.kind === 'cal') {
    const cell = underPointer(e, '.cal-cell'); if (!cell) return clearDropUI();
    if (!cell.classList.contains('drag-over')) { clearDropUI(); cell.classList.add('drag-over'); }
    pd.target = cell.dataset.day;
  }
}
async function finishPointerDrag() {
  const d = pd; pd = null;
  if (!d || !d.started) { pd = null; return; }
  suppressClick = true; setTimeout(() => suppressClick = false, 60);
  if (d.ghost) d.ghost.remove();
  const target = d.target, after = d.after, zone = d.zone, idx = d.idx;
  resetDrag();                                   // always leaves a clean state, then repaints
  if (!target) return;
  if (d.kind === 'section') {
    if (target === d.id) return;
    const sec = S.data.sections[d.id]; if (!sec) return;
    return reorderList(sectionsOf(sec.projectId), 'sections', d.id, target, after);
  }
  if (d.kind === 'project') { if (target === d.id) return; return reorderList(projects(), 'projects', d.id, target, after); }
  if (d.kind === 'tab') { if (target === d.id) return; return reorderList(accounts(true), 'accounts', d.id, target, after); }
  if (d.kind === 'campaign') {
    if (target === d.id) return;
    const c = S.data.campaigns[d.id], t = S.data.campaigns[target];
    if (!c || !t || t.accountId !== c.accountId) return;      // ordering is per account
    return reorderList(campaignsOf(c.accountId, true), 'campaigns', d.id, target, after);
  }
  if (d.kind === 'card') {
    const pid = zone.dataset.dropPid, sec = zone.dataset.dropSec || null;
    const list = tasksIn(pid, sec, !!S.showCompleted[pid]).filter(t => t.id !== d.id);
    list.splice(Math.min(idx, list.length), 0, S.data.tasks[d.id]);
    const ops = [];
    list.forEach((t, i) => {
      const data = { order: (i + 1) * 1000 };
      if (t.id === d.id) { data.sectionId = sec; data.projectId = pid; }
      if (t.order !== data.order || t.id === d.id) ops.push({ type: 'update', col: 'tasks', id: t.id, data });
    });
    return store.batch(ops);
  }
  if (d.kind === 'cal') {
    const [kind, id, from] = d.id.split(':'), day = target;
    if (from === day) return;
    if (kind === 'task') {
      const t = S.data.tasks[id]; if (!t) return;
      const data = { due: day };
      if (t.recur && ['monthly', 'yearly'].includes(t.recur.type)) data.recur = { ...t.recur, day: parseKey(day).getDate() };
      if (t.deadline && t.due) data.deadline = addDays(t.deadline, dayDiff(t.due, day));
      return store.update('tasks', id, data);
    }
    const ev = S.data.events[id]; if (!ev) return;
    const n = dayDiff(from, day);
    return store.update('events', id, { start: addDays(ev.start, n), end: addDays(ev.end || ev.start, n) });
  }
}
function cancelPointerDrag() {
  if (!pd) return;
  const d = pd; pd = null;
  if (d.ghost) d.ghost.remove();
  resetDrag();
}
function resetDrag() {
  S.drag = null; S.dragAt = 0;
  $$('.dragging').forEach(x => x.classList.remove('dragging'));
  $$('.drag-ghost').forEach(x => x.remove());
  clearDropUI();
  document.body.classList.remove('dragging-active');
  if (S.renderPending) { S.renderPending = false; render(); }
}
document.addEventListener('mousemove', e => {
  if (!pd) return;
  if (!pd.started) {
    if (Math.abs(e.clientX - pd.x0) + Math.abs(e.clientY - pd.y0) < 6) return;   // a click, not a drag
    startPointerDrag(e);
  }
  e.preventDefault();
  updatePointerDrag(e);
});
document.addEventListener('mouseup', () => { if (pd) finishPointerDrag(); });
window.addEventListener('blur', cancelPointerDrag);
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelPointerDrag(); });
// Last resort: a drag that somehow stops reporting is cleared so the app never stays stuck.
setInterval(() => { if (S.drag && Date.now() - (S.dragAt || 0) > 3000) { pd = null; resetDrag(); } }, 1000);
// Swallow the click that follows a real drag (so dropping a card doesn't also open it).
document.addEventListener('click', e => {
  if (!suppressClick) return;
  e.preventDefault(); e.stopPropagation(); suppressClick = false;
}, true);

// Keyboard reordering for campaign cards (the handle is focusable).
document.addEventListener('keydown', e => {
  const g = document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-grip]');
  if (!g || !['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;

});

        <div class="prop"><span class="lbl-sm">Date</span><div class="inline"><input type="date" class="inp" data-f="due" value="${d.due || ''}"><input type="time" class="inp" data-f="time" value="${d.time || ''}" style="width:92px" title="Time (optional)"><button class="clear-x" data-m="clear-due" title="Remove date">${ico('x', 'i-sm')}</button></div></div>
        <div class="prop"><span class="lbl-sm">Repeat</span><div class="inline">
          <select class="sel" data-f="recurType">${[['', 'Does not repeat'], ['daily', 'Daily'], ['weekdays', 'Every weekday (Mon–Fri)'], ['weekly', 'Weekly'], ['monthly', 'Monthly'], ['yearly', 'Yearly']].map(([v, l]) => `<option value="${v}" ${(d.recur?.type || '') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <span data-every-wrap class="inline" style="gap:4px;color:var(--muted);font-size:12px;white-space:nowrap">every<input type="number" min="1" max="99" class="inp" data-f="every" value="${d.recur?.every || 1}" style="width:50px"></span></div>
          <div class="hint" data-recur-hint></div></div>
        <div class="prop"><span class="lbl-sm">Deadline</span><div class="inline"><input type="date" class="inp" data-f="deadline" value="${d.deadline || ''}"><button class="clear-x" data-m="clear-deadline" title="Remove deadline">${ico('x', 'i-sm')}</button></div></div>
        <div class="prop"><span class="lbl-sm">Priority</span><select class="sel" data-f="priority">${[[1, 'Priority 1 — urgent'], [2, 'Priority 2 — high'], [3, 'Priority 3 — medium'], [4, 'Priority 4 — none']].map(([v, l]) => `<option value="${v}" ${+d.priority === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="prop"><span class="lbl-sm">Assignee</span><select class="sel" data-f="assignee"><option value="">Unassigned</option>${ppl.map(p => `<option value="${p.id}" ${d.assignee === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
          ${ppl.length ? '' : '<div class="hint">Add teammates in Settings to assign tasks.</div>'}</div>
        ${ex ? `<div class="prop tm-foot-info">Added ${ex.createdAt ? timeAgo(ex.createdAt) : ''}${ex.createdBy ? ' by ' + esc(ex.createdBy) : ''}${ex.lastDoneAt ? `<br>Last done ${timeAgo(ex.lastDoneAt)}${ex.lastDoneBy ? ' by ' + esc(ex.lastDoneBy) : ''}` : ''}${ex.done && ex.completedAt ? `<br>Completed ${timeAgo(ex.completedAt)}${ex.completedBy ? ' by ' + esc(ex.completedBy) : ''}` : ''}</div>` : ''}
      </div>
    </div>
    <div class="modal-foot">${ex ? `<button class="btn btn-danger" data-m="delete">${ico('trash', 'i-sm')} Delete</button>` : ''}<span class="spacer"></span>
      ${ex ? '' : '<button class="btn" data-m="x">Cancel</button>'}<button class="btn btn-primary" data-m="save">${ex ? 'Save' : 'Add task'}</button></div>`, 'wide');

  const q = s => w.querySelector(s);
  const title = q('[data-f=title]'), desc = q('[data-f=description]');
  const grow = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };
  const crumb = () => { const p = S.data.projects[d.projectId], s = d.sectionId && S.data.sections[d.sectionId];
    q('[data-crumb]').innerHTML = p ? `<span class="tx-${esc(p.color || 'grey')}" style="font-weight:700">#</span> ${esc(p.name)}${s ? ` <span style="color:var(--faint)">/</span> ${esc(s.name)}` : ''}` : ''; };
  const recurUI = () => {
    const t = q('[data-f=recurType]').value;
    q('[data-every-wrap]').classList.toggle('hidden', !t || t === 'weekdays');
    const r = t ? { type: t, every: +q('[data-f=every]').value || 1 } : null;
    const due = q('[data-f=due]').value;
    q('[data-recur-hint]').textContent = r ? `${recurLabel(r)}${due ? ' · from ' + longDay(due) : ' · starting today'}. Ticking it off moves it to the next date.` : '';
  };
  const renderSubs = () => {
    q('[data-subs]').innerHTML = d.subtasks.map((s, i) => `<div class="sub-row ${s.done ? 'done' : ''}">
      <button class="check ${s.done ? 'checked' : ''}" data-sub-toggle="${i}">${ico('check')}</button>
      <input class="bare" data-sub-edit="${i}" value="${esc(s.title)}" maxlength="200">
      <button class="icon-btn" data-sub-del="${i}" title="Remove">${ico('x', 'i-sm')}</button></div>`).join('');
    q('[data-subcount]').textContent = d.subtasks.length ? `${d.subtasks.filter(s => s.done).length}/${d.subtasks.length}` : '';
  };
  const renderComments = () => {
    const box = q('[data-comments]'); if (!box) return;
    const cs = (S.data.tasks[d.id]?.comments) || [];
    box.innerHTML = cs.map(c => `<div class="comment"><span class="avatar">${esc(initials(c.by))}</span><div class="c-body">
      <div class="c-meta"><b>${esc(c.by)}</b>${timeAgo(c.at)}${c.byEmail === (S.user?.email || '') ? ` · <button data-cdel="${c.id}" style="color:var(--faint);font-size:11px">delete</button>` : ''}</div>
      <div class="c-text">${esc(c.text)}</div></div></div>`).join('') || '<div class="hint" style="color:var(--faint);font-size:12px">No comments yet — handy for handover notes.</div>';
  };
  crumb(); recurUI(); renderSubs(); renderComments();
  setTimeout(() => { grow(title); grow(desc); }, 0);

  const collect = () => {
    d.title = title.value.trim(); d.description = desc.value.trim();
    const [p, s] = q('[data-f=loc]').value.split('|'); d.projectId = p; d.sectionId = s || null;
    d.due = q('[data-f=due]').value || null; d.time = q('[data-f=time]').value || null;
    const rt = q('[data-f=recurType]').value;
    d.recur = rt ? { type: rt, every: Math.max(1, Math.min(99, +q('[data-f=every]').value || 1)) } : null;
    if (d.recur && !d.due) d.due = todayKey();
    if (d.recur && ['monthly', 'yearly'].includes(rt)) d.recur.day = parseKey(d.due).getDate();
    d.deadline = q('[data-f=deadline]').value || null;
    d.priority = +q('[data-f=priority]').value || 4;
    d.assignee = q('[data-f=assignee]').value || null;
    d.subtasks = d.subtasks.filter(s => s.title.trim());
  };
  const dirty = () => { collect(); return JSON.stringify(pick(d, EDITABLE)) !== orig; };
  const save = async () => {
    collect();
    if (!d.title) { title.focus(); toast('Give the task a name first'); return false; }
    if (ex) {
      if (!S.data.tasks[d.id]) { w.close(); return true; }
      const moved = ex.projectId !== d.projectId || (ex.sectionId || null) !== d.sectionId;
      const data = { ...pick(d, EDITABLE), updatedAt: Date.now(), updatedBy: me() };
      if (moved) data.order = nextOrder(tasksIn(d.projectId, d.sectionId, true));
      await store.update('tasks', d.id, data);
    } else {
      d.order = nextOrder(tasksIn(d.projectId, d.sectionId, true)); d.createdAt = Date.now();
      await store.put('tasks', d);
    }
    w.close(); return true;
  };
  w.onDismiss = async () => {
    if (ex) { if (dirty()) await save(); else w.close(); return; }
    if (title.value.trim() && !await confirmBox('Discard this new task?', 'Discard', 'Discard task?')) return;
    w.close();
  };
  title.addEventListener('input', () => grow(title));
  title.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
  desc.addEventListener('input', () => grow(desc));
  q('[data-f=loc]').addEventListener('change', () => { collect(); crumb(); });
  q('[data-f=recurType]').addEventListener('change', recurUI);
  q('[data-f=every]').addEventListener('input', recurUI);
  q('[data-f=due]').addEventListener('change', recurUI);
  q('[data-f=priority]').addEventListener('change', e => { const c = q('.tm-title-row .check'); c.className = c.className.replace(/p\d/, 'p' + e.target.value); });
  q('[data-subnew]').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return; e.preventDefault();
    const v = e.target.value.trim(); if (!v) return;
    d.subtasks.push({ id: uid(), title: v, done: false }); e.target.value = ''; renderSubs();
  });
  w.addEventListener('input', e => { const i = e.target.dataset.subEdit; if (i != null) d.subtasks[i].title = e.target.value; });
  w.addEventListener('click', async e => {
    const b = e.target.closest('[data-m],[data-sub-toggle],[data-sub-del],[data-cdel]'); if (!b) return;
    if (b.dataset.subToggle != null) { const s = d.subtasks[b.dataset.subToggle]; s.done = !s.done; renderSubs(); return; }
    if (b.dataset.subDel != null) { d.subtasks.splice(+b.dataset.subDel, 1); renderSubs(); return; }
    if (b.dataset.cdel) { const t = S.data.tasks[d.id]; await store.update('tasks', d.id, { comments: (t.comments || []).filter(c => c.id !== b.dataset.cdel) }); renderComments(); return; }
    const m = b.dataset.m;
    if (m === 'x') return w.onDismiss();
    if (m === 'save') return save();
    if (m === 'clear-due') { q('[data-f=due]').value = ''; q('[data-f=time]').value = ''; q('[data-f=recurType]').value = ''; recurUI(); }
    if (m === 'clear-deadline') q('[data-f=deadline]').value = '';
    if (m === 'delete') { if (await deleteTask(d.id)) w.close(); }
    if (m === 'complete') { if (dirty()) { if (!await save()) return; } else w.close(); toggleTask(d.id); }
    if (m === 'comment') {
      const ta = q('[data-cnew]'), text = ta.value.trim(); if (!text) return ta.focus();
      const t = S.data.tasks[d.id];
      await store.update('tasks', d.id, { comments: [...(t.comments || []), { id: uid(), by: me(), byEmail: S.user?.email || '', at: Date.now(), text }] });
      ta.value = ''; renderComments();
    }
  });
}

/* ===================== calendar entry modal ===================== */
function openEvent(id, { day } = {}) {
  const ex = id ? S.data.events[id] : null;
  const base = day || todayKey();
  const d = ex ? clone(ex) : { id: uid(), person: '', type: types()[0].id, title: '', start: base, end: base, time: '', timeEnd: '', repeat: { type: 'none', every: 1, until: '' }, note: '', skip: [] };
  d.repeat = d.repeat || { type: 'none', every: 1, until: '' };
  const isRep = ex && d.repeat.type !== 'none', multi = ex && (d.end || d.start) !== d.start;
  const repVal = d.repeat.type === 'weekly' ? (d.repeat.every === 2 ? 'biweekly' : 'weekly') : d.repeat.type;
  const w = openModal(`
    <div class="modal-head"><h2>${ex ? 'Edit calendar entry' : 'Add leave / event'}</h2><button class="icon-btn" data-m="x">${ico('x')}</button></div>
    <form class="modal-body">
      <div class="row2">
        <div class="field"><label>Who</label><select class="sel" data-f="person"><option value="">— Whole team / nobody —</option>
          ${people().map(p => `<option value="${p.id}" ${d.person === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="__new">＋ Add a person…</option></select></div>
        <div class="field"><label>Type</label><select class="sel" data-f="type">${types().map(t => `<option value="${t.id}" ${d.type === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Title <span style="font-weight:400;color:var(--faint)">(optional)</span></label><input class="inp" data-f="title" value="${esc(d.title)}" maxlength="120"></div>
      <div class="row2">
        <div class="field"><label>From</label><input type="date" class="inp" data-f="start" value="${d.start}" required></div>
        <div class="field"><label>To</label><input type="date" class="inp" data-f="end" value="${d.end || d.start}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Start time <span style="font-weight:400;color:var(--faint)">(optional)</span></label><input type="time" class="inp" data-f="time" value="${d.time || ''}"></div>
        <div class="field"><label>End time</label><input type="time" class="inp" data-f="timeEnd" value="${d.timeEnd || ''}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Repeat</label><select class="sel" data-f="repeat">${[['none', 'Does not repeat'], ['weekly', 'Every week'], ['biweekly', 'Every 2 weeks'], ['monthly', 'Every month']].map(([v, l]) => `<option value="${v}" ${repVal === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="field" data-until><label>Until <span style="font-weight:400;color:var(--faint)">(optional)</span></label><input type="date" class="inp" data-f="until" value="${d.repeat.until || ''}"></div>
      </div>
      <div class="field" style="margin-bottom:0"><label>Note</label><textarea class="ta" data-f="note" rows="2" style="min-height:52px">${esc(d.note || '')}</textarea></div>
      ${(d.skip || []).length ? `<div class="hint" style="font-size:11.5px;color:var(--faint);margin-top:8px">Removed days: ${d.skip.map(fmtDay).join(', ')} · <button type="button" data-m="unskip" style="color:var(--accent-text);font-size:11.5px">restore</button></div>` : ''}
      <button type="submit" hidden></button>
    </form>
    <div class="modal-foot">${ex ? `<button class="btn btn-danger" data-m="delete">${ico('trash', 'i-sm')} Delete</button>` : ''}
      ${ex && day && (isRep || multi) ? `<button class="btn" data-m="skip" title="Keep the rest, remove just this day">Remove ${fmtDay(day)} only</button>` : ''}
      <span class="spacer"></span><button class="btn" data-m="x">Cancel</button><button class="btn btn-primary" data-m="save">Save</button></div>`);
  const q = s => w.querySelector(s);
  const untilUI = () => q('[data-until]').classList.toggle('hidden', q('[data-f=repeat]').value === 'none');
  const placeholder = () => { const p = personById(q('[data-f=person]').value), t = typeById(q('[data-f=type]').value); q('[data-f=title]').placeholder = p ? `${p.name} - ${t.name}` : t.name; };
  untilUI(); placeholder();
  q('[data-f=repeat]').onchange = untilUI;
  q('[data-f=type]').onchange = placeholder;
  q('[data-f=start]').onchange = () => { const s = q('[data-f=start]'), e = q('[data-f=end]'); if (!e.value || e.value < s.value) e.value = s.value; };
  q('[data-f=person]').onchange = async e => {
    if (e.target.value !== '__new') return placeholder();
    const r = await promptBox({ title: 'Add a teammate', placeholder: 'e.g. Ali', color: COLORS[people().length % COLORS.length] });
    if (!r) { e.target.value = d.person || ''; return placeholder(); }
    const p = { id: uid(), name: r.value, color: r.color };
    await saveSettings({ people: [...people(), p] });
    const opt = document.createElement('option'); opt.value = p.id; opt.textContent = p.name;
    e.target.insertBefore(opt, e.target.lastElementChild); e.target.value = p.id; placeholder();
  };
  const save = async () => {
    const start = q('[data-f=start]').value; if (!start) return q('[data-f=start]').focus();
    let end = q('[data-f=end]').value || start; if (end < start) end = start;
    const rv = q('[data-f=repeat]').value;
    const obj = { ...d, person: q('[data-f=person]').value.replace('__new', ''), type: q('[data-f=type]').value, title: q('[data-f=title]').value.trim(),
      start, end, time: q('[data-f=time]').value, timeEnd: q('[data-f=timeEnd]').value, note: q('[data-f=note]').value.trim(),
      repeat: rv === 'none' ? { type: 'none', every: 1, until: '' } : { type: rv === 'monthly' ? 'monthly' : 'weekly', every: rv === 'biweekly' ? 2 : 1, until: q('[data-f=until]').value || '' },
      updatedAt: Date.now(), updatedBy: me() };
    if (!ex) { obj.createdAt = Date.now(); obj.createdBy = me(); }
    await store.put('events', obj); w.close();
  };
  w.onDismiss = () => w.close();
  q('form').onsubmit = e => { e.preventDefault(); save(); };
  w.addEventListener('click', async e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    const m = b.dataset.m;
    if (m === 'x') w.close();
    if (m === 'save') save();
    if (m === 'skip') { await store.update('events', d.id, { skip: [...(d.skip || []), day] }); w.close(); toast(`Removed ${fmtDay(day)}`, () => store.update('events', d.id, { skip: d.skip || [] })); }
    if (m === 'unskip') { await store.update('events', d.id, { skip: [] }); w.close(); }
    if (m === 'delete') {
      if (!await confirmBox(`Delete <b>${esc(evTitle(d))}</b>${isRep ? ' and all its repeats' : ''}?`)) return;
      await store.del('events', d.id); w.close(); toast('Entry deleted', () => store.put('events', ex));
    }
  });
}

function openDay(day) {
  const evs = Object.values(S.data.events).filter(ev => eventDays(ev, day, day).length).map(ev => ({ kind: 'ev', ev, d: day }));
  const ts = activeTasks().filter(t => t.due === day).map(t => ({ kind: 'task', t, d: day }));
  const w = openModal(`<div class="modal-head"><h2>${longDay(day)}</h2><button class="icon-btn" data-x>${ico('x')}</button></div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:4px">${[...evs, ...ts].map(calItemHTML).join('') || '<span style="color:var(--faint)">Nothing scheduled.</span>'}</div>
    <div class="modal-foot"><button class="btn" data-add="ev">${ico('plus', 'i-sm')} Leave / event</button><button class="btn" data-add="task">${ico('plus', 'i-sm')} Task</button><span class="spacer"></span><button class="btn" data-x>Close</button></div>`);
  $$('[draggable]', w).forEach(x => x.removeAttribute('draggable'));
  $$('[data-x]', w).forEach(b => b.onclick = () => w.close());
  w.querySelector('[data-add=ev]').onclick = () => { w.close(); openEvent(null, { day }); };
  w.querySelector('[data-add=task]').onclick = () => { w.close(); openTask(null, { due: day }); };
}

/* ===================== search ===================== */
function openSearch() {
  const w = openModal(`<div class="modal-head">${ico('search')}<input class="inp" data-q placeholder="Search tasks…" autofocus style="border:0;background:transparent;padding:4px 0"><button class="icon-btn" data-x>${ico('x')}</button></div>
    <div class="modal-body"><div class="search-list" data-res></div></div>`, 'wide');
  const inp = w.querySelector('[data-q]'), res = w.querySelector('[data-res]');
  const run = () => {
    const v = inp.value.trim().toLowerCase();
    if (!v) { res.innerHTML = '<div style="color:var(--faint);padding:6px 0">Type to search task names, descriptions and sub-tasks.</div>'; return; }
    const hits = Object.values(S.data.tasks).filter(t => (t.title + ' ' + (t.description || '') + ' ' + (t.subtasks || []).map(s => s.title).join(' ')).toLowerCase().includes(v))
      .sort((a, b) => a.done - b.done).slice(0, 60);
    res.innerHTML = hits.map(rowHTML).join('') || '<div style="color:var(--faint);padding:6px 0">No matching tasks.</div>';
  };
  run(); inp.oninput = run;
  w.querySelector('[data-x]').onclick = () => w.close();
  res.addEventListener('click', e => {
    const chk = e.target.closest('[data-action=toggle-task]'); if (chk) { e.stopPropagation(); toggleTask(chk.dataset.id, chk).then(() => setTimeout(run, 50)); return; }
    const row = e.target.closest('[data-action=open-task]'); if (row) { e.stopPropagation(); w.close(); openTask(row.dataset.id); }
  });
}

      ${members.map(m => `<div class="set-row"><span class="avatar sm">${esc(initials(m.id))}</span><span style="flex:1">${esc(m.id)}</span>${isOwner ? `<button class="icon-btn" data-mdel="${esc(m.id)}" title="Remove access">${ico('trash', 'i-sm')}</button>` : ''}</div>`).join('') || '<p class="set-p" style="color:var(--faint)">No one else has access yet.</p>'}
